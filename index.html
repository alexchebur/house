<!--

<style>
  :root{
    --warm:#ff6a2b;        /* акцент «тепло» (Т Плюс) */
    --warm-soft:#ffb066;
    --deep:#0b1c2e;        /* глубокий синий */
    --snow:#eef4fa;
    --ink:rgba(238,244,250,.72);
    --panel:rgba(11,28,46,.42);
    --line:rgba(238,244,250,.16);
    --serif:"Georgia","Iowan Old Style","Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --sa-b:env(safe-area-inset-bottom,0px);
    --sa-l:env(safe-area-inset-left,0px);
    --sa-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--deep);color:var(--snow);font-family:var(--sans);overflow:hidden}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;
       background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(4,12,22,.55) 100%)}

  /* ── брендинговый лок-ап ── */
  #brand{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:calc(20px + var(--sa-r));
         display:flex;align-items:center;gap:10px;opacity:0;animation:fadeIn 1.2s .4s forwards}
  #brand .mark{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--warm),#ff9a45);color:#1b0d04;font-weight:800;font-size:15px;
    box-shadow:0 6px 20px rgba(255,106,43,.35)}
  #brand .txt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);line-height:1.35}
  #brand .txt b{display:block;color:var(--snow);letter-spacing:.1em;font-weight:600}

  /* ── титул пролога ── */
  #prolog{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;
          padding:0 24px;transition:opacity .9s ease,letter-spacing 1.2s ease}
  #prolog .k{font-size:clamp(9px,2.4vw,12px);letter-spacing:.42em;text-transform:uppercase;color:var(--warm-soft)}
  #prolog h1{font-family:var(--serif);font-weight:400;margin:.35em 0 .2em;
             font-size:clamp(38px,11vw,104px);letter-spacing:.16em;line-height:1}
  #prolog p{margin:0;color:var(--ink);font-size:clamp(11px,3vw,15px);letter-spacing:.06em}
  #prolog.hide{opacity:0;letter-spacing:.3em}

  /* ── финальная карта ── */
  #endcard{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;padding:0 24px;
           opacity:0;transition:opacity 1.1s ease}
  #endcard.show{opacity:1}
  #endcard h2{font-family:var(--serif);font-weight:400;margin:0;font-size:clamp(30px,8.4vw,74px);letter-spacing:.1em}
  #endcard .rule{width:64px;height:2px;margin:18px auto;background:var(--warm)}
  #endcard p{margin:0;color:var(--ink);font-size:clamp(11px,3vw,14px);letter-spacing:.18em;text-transform:uppercase}

  /* ── подпись главы ── */
  #caption{position:absolute;left:calc(24px + var(--sa-l));bottom:calc(96px + var(--sa-b));max-width:min(430px,72vw);
           padding:14px 16px;border-radius:14px;border:1px solid var(--line);
           background:var(--panel);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px);
           opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
  #caption.in{opacity:1;transform:none}
  #caption .k{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--warm-soft)}
  #caption h3{font-family:var(--serif);font-weight:400;margin:.3em 0 .35em;font-size:clamp(19px,4.6vw,27px);letter-spacing:.03em}
  #caption p{margin:0;font-size:clamp(11px,2.9vw,13.5px);line-height:1.5;color:var(--ink)}

  /* ── контроллы ── */
  #controls{position:absolute;left:calc(20px + var(--sa-l));right:calc(20px + var(--sa-r));
            bottom:calc(20px + var(--sa-b));pointer-events:auto;display:flex;flex-direction:column;gap:10px}
  #bar{position:relative;height:22px;display:flex;align-items:center;cursor:pointer}
  #bar .track{position:absolute;left:0;right:0;height:2px;background:rgba(238,244,250,.18)}
  #bar .fill{position:absolute;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--warm),var(--warm-soft))}
  #bar .dots{position:absolute;left:0;right:0;height:22px}
  #bar .dot{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
            background:rgba(238,244,250,.3);transition:background .3s,transform .3s}
  #bar .dot.on{background:var(--warm);transform:scale(1.35)}
  #row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{pointer-events:auto;font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--snow);background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:9px 14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:.25s}
  button:hover{border-color:var(--warm);color:#fff}
  button.on{background:linear-gradient(140deg,var(--warm),#ff9a45);color:#1b0d04;border-color:transparent}
  #meta{margin-left:auto;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(238,244,250,.42)}
  #hint{position:absolute;right:calc(22px + var(--sa-r));bottom:calc(96px + var(--sa-b));text-align:right;
        font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,244,250,.34);
        opacity:0;animation:fadeIn 1s 1.6s forwards}
  #load{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:var(--deep);
        font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);transition:opacity .6s}
  #load.gone{opacity:0;pointer-events:none}
  @keyframes fadeIn{to{opacity:1}}
  @media (max-width:640px){
    #caption{left:calc(14px + var(--sa-l));right:calc(14px + var(--sa-r));max-width:none;bottom:calc(104px + var(--sa-b));padding:11px 13px}
    #hint{display:none} #meta{display:none}
    button{padding:8px 11px;font-size:11px}
  }
  @media (max-height:460px){ #caption{bottom:calc(78px + var(--sa-b))} #prolog{top:40%} }
</style>

<div class="vig"></div>

<div id="ui">

  <div id="prolog">
    <div class="k">Свердловская область · Урал</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════
   0. КОНФИГ: палитра, тайминги, тексты — всё правится здесь
   ═══════════════════════════════════════════════════════════════ */
const C = {
  warm:0xff6a2b, warmSoft:0xffb066, deep:0x0b1c2e,
  night:{top:0x081726, bot:0x18374f}, dusk:{top:0x123049, bot:0xd98a52},
  snow:0xe6eef7, wood:0x9a6b43, woodEnd:0xc79a63, woodDark:0x6d4728,
  carve:0xf3e6d0, roof:0x4b4640, brick:0x9c5b4a, stone:0x8a8f96, fir:0x2c4a44
};
const DUR = 44;                       // полная длительность, сек
const CH = [                          // главы (t — секунда старта)
  {t:0.0,  k:'Пролог',        h:'Верхотурье',            p:'Город-заповедник деревянного зодчества. И дом, который ждут.'},
  {t:3.6,  k:'01 · Основание',h:'Камень и место',        p:'Дом начинается с фундамента — и с памяти о месте.'},
  {t:8.6,  k:'02 · Сруб',     h:'Венцы',                 p:'Лиственница, тесло, чаша в чашу. Ручная работа, а не типовое решение.'},
  {t:14.6, k:'03 · Кровля',   h:'Крыша и фронтон',       p:'Скат, конёк, причелина — узнаваемый силуэт уральской улицы.'},
  {t:19.6, k:'04 · Резьба',   h:'Наличники',             p:'Пропильный орнамент — почерк верхотурских мастеров.'},
  {t:25.0, k:'05 · Тепло',    h:'Дом оживает',           p:'Свет в окнах, дым над трубой, тепло внутри. Дом снова нужен.'},
  {t:30.2, k:'06 · Толока',   h:'Верхотурская толока',   p:'Соседи, волонтёры, мастера: наследие возвращают к жизни сообща.'},
  {t:37.5, k:'07 · Наследие', h:'Верстовой дом',         p:'Тепло, которое сохраняет город. ПАО «Т Плюс».'}
];
const Q = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = innerWidth < 760 || /Android|iPhone|iPad/i.test(navigator.userAgent);
let LOOP = Q.get('loop') !== '0';

/* детерминированный ГПСЧ — сцену можно воспроизвести кадр в кадр */
const mulberry = a => () => (a=a+0x6D2B79F5|0, ((t)=>{t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296})(a));
const rnd = mulberry(1598);           // 1598 — год основания Верхотурья
const rr = (a,b)=>a+(b-a)*rnd();
const clamp01 = v=>v<0?0:v>1?1:v;
const lerp = (a,b,t)=>a+(b-a)*t;
const E = {
  lin:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>1+2.2*Math.pow(t-1,3)+1.2*Math.pow(t-1,2),
  outElastic:t=>t===0||t===1?t:Math.pow(2,-9*t)*Math.sin((t*10-.75)*2.09)+1
};

/* ═══════════════════════════════════════════════════════════════
   1. РЕНДЕРЕР / СЦЕНА
   ═══════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('scene');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:!MOBILE, powerPreference:'high-performance'});
}catch(e){ document.getElementById('load').textContent='WebGL недоступен'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio||1, MOBILE?1.5:1.9));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = !MOBILE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(C.night.bot), 0.0135);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 600);

/* небо-градиент */
const skyU = {top:{value:new THREE.Color(C.night.top)}, bot:{value:new THREE.Color(C.night.bot)}};
scene.add(new THREE.Mesh(new THREE.SphereGeometry(320,32,20), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
  vertexShader:`varying float h; void main(){ vec4 w=modelMatrix*vec4(position,1.); h=normalize(w.xyz).y;
    gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform vec3 top,bot; varying float h; void main(){
    float k=pow(clamp(h*.5+.5,0.,1.),.85); gl_FragColor=vec4(mix(bot,top,k),1.); }`
})));

/* свет */
const hemi = new THREE.HemisphereLight(0x9fc4e8, 0x24384e, .55); scene.add(hemi);
const sun  = new THREE.DirectionalLight(0xbcd6ff, 2.1);
sun.position.set(-16,20,13); sun.castShadow = !MOBILE;
sun.shadow.mapSize.set(1024,1024); sun.shadow.bias=-0.0009;
const sc = sun.shadow.camera; sc.left=-15; sc.right=15; sc.top=15; sc.bottom=-15; sc.near=1; sc.far=70;
scene.add(sun);
const lampIn  = new THREE.PointLight(0xffa24a, 0, 20, 2); lampIn.position.set(0,2.1,0); scene.add(lampIn);
const lampOut = new THREE.PointLight(0xff8a3d, 0, 14, 2); lampOut.position.set(0,1.7,3.6); scene.add(lampOut);

/* мягкая круглая текстура для частиц/бликов */
function softTex(){
  const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d').createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.45,'rgba(255,255,255,.5)'); g.addColorStop(1,'rgba(255,255,255,0)');
  const x=cv.getContext('2d'); x.fillStyle=g; x.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const TEX = softTex();

/* ═══════════════════════════════════════════════════════════════
   2. СИСТЕМА РАСКРЫТИЯ (stateless: всё считается от t)
   ═══════════════════════════════════════════════════════════════ */
const tracks = [];
function reveal(obj, t0, {dur=.9, ease=E.outCubic, mode='drop', dist=3, axis='y', rot=0}={}){
  obj.visible = false;
  tracks.push({obj,t0,dur,ease,mode,dist,axis,rot,
    p:obj.position.clone(), s:obj.scale.clone(), r:obj.rotation.clone()});
  return obj;
}
function applyTracks(t){
  for(const k of tracks){
    const e = k.ease(clamp01((t-k.t0)/k.dur));
    k.obj.visible = e > .001;
    if(!k.obj.visible) continue;
    const o=k.obj;
    if(k.mode==='drop'||k.mode==='rise'){
      o.position.copy(k.p); o.scale.copy(k.s); o.rotation.copy(k.r);
      o.position[k.axis] = k.p[k.axis] + (k.mode==='drop'?1:-1)*k.dist*(1-e);
    }else if(k.mode==='pop'){
      o.position.copy(k.p); o.rotation.copy(k.r); o.scale.copy(k.s).multiplyScalar(e);
    }else if(k.mode==='swing'){
      o.position.copy(k.p); o.scale.copy(k.s); o.rotation.copy(k.r);
      o.position.y = k.p.y + k.dist*(1-e); o.rotation.z = k.r.z + k.rot*(1-e);
    }else if(k.mode==='fade'){
      o.position.copy(k.p); o.scale.copy(k.s); o.rotation.copy(k.r);
      o.material.opacity = e;
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   3. ЛАНДШАФТ
   ═══════════════════════════════════════════════════════════════ */
const groundGeo = new THREE.PlaneGeometry(220,220,72,72);
{
  const p = groundGeo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i), d=Math.hypot(x,y);
    const flat = clamp01((d-9)/14);
    p.setZ(i, (Math.sin(x*.16)*Math.cos(y*.13)*.9 + Math.sin(x*.05+y*.07)*1.7) * flat);
  }
  groundGeo.computeVertexNormals();
}
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({color:C.snow, roughness:.94, metalness:0}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = !MOBILE; scene.add(ground);

/* холмы */
const hills = new THREE.Group(); scene.add(hills);
for(let i=0;i<7;i++){
  const r=rr(16,34), m=new THREE.Mesh(new THREE.SphereGeometry(r,10,7,0,Math.PI*2,0,Math.PI/2),
    new THREE.MeshStandardMaterial({color:0xcfdae8, roughness:1, flatShading:true}));
  const a=rr(-Math.PI,Math.PI), d=rr(60,110);
  m.position.set(Math.cos(a)*d, -r*rr(.55,.78), Math.sin(a)*d-20);
  m.scale.y=rr(.35,.6); hills.add(m);
}
reveal(hills,.2,{dur:2.4,mode:'fade'}); hills.children.forEach(c=>{c.material.transparent=true;});

/* ели — instanced */
const trees = new THREE.Group(); scene.add(trees);
{
  const N = MOBILE?18:30, mat=new THREE.MeshStandardMaterial({color:C.fir, roughness:.9, flatShading:true});
  const tiers=[new THREE.ConeGeometry(1.5,2.4,7),new THREE.ConeGeometry(1.15,2.1,7),new THREE.ConeGeometry(.75,1.7,7)];
  const inst=tiers.map(g=>{const m=new THREE.InstancedMesh(g,mat,N); m.castShadow=!MOBILE; trees.add(m); return m;});
  const M=new THREE.Matrix4(), Qt=new THREE.Quaternion(), S=new THREE.Vector3(), P=new THREE.Vector3();
  for(let i=0;i<N;i++){
    let a=rr(0,Math.PI*2), d=rr(15,52);
    if(Math.abs(Math.sin(a))<.25 && Math.cos(a)>0) d+=16;   // не загораживать фасад
    const x=Math.cos(a)*d, z=Math.sin(a)*d, s=rr(.75,1.7);
    for(let k=0;k<3;k++){
      P.set(x, (1.1+k*1.35)*s, z); S.set(s,s,s);
      Qt.setFromAxisAngle(new THREE.Vector3(0,1,0), rr(0,6.28));
      inst[k].setMatrixAt(i, M.compose(P,Qt,S));
    }
  }
  inst.forEach(m=>m.instanceMatrix.needsUpdate=true);
}
reveal(trees,.6,{dur:2.6,mode:'rise',dist:4});

/* силуэт собора (Троицкий собор Верхотурья) — дальний план */
const cathedral = new THREE.Group();
{
  const mat=new THREE.MeshStandardMaterial({color:0x2b4a66, roughness:1, transparent:true, opacity:0, fog:true});
  const body=new THREE.Mesh(new THREE.BoxGeometry(9,7,7),mat); body.position.y=3.5; cathedral.add(body);
  const drum=new THREE.Mesh(new THREE.BoxGeometry(4.4,3,4.4),mat); drum.position.y=8.4; cathedral.add(drum);
  const prof=[[.02,0],[.34,.06],[.52,.32],[.47,.66],[.28,.98],[.11,1.24],[.02,1.5]].map(p=>new THREE.Vector2(p[0],p[1]));
  const domeGeo=new THREE.LatheGeometry(prof,14);
  [[0,10,0,2.3],[2.6,7.6,2.6,1.3],[-2.6,7.6,2.6,1.3],[2.6,7.6,-2.6,1.3],[-2.6,7.6,-2.6,1.3]].forEach(([x,y,z,s])=>{
    const d=new THREE.Mesh(domeGeo,mat); d.position.set(x,y,z); d.scale.setScalar(s); cathedral.add(d);
    const cr=new THREE.Mesh(new THREE.BoxGeometry(.07,.9*s,.07),mat); cr.position.set(x,y+1.6*s,z); cathedral.add(cr);
  });
  cathedral.position.set(-30,-1.5,-58); cathedral.scale.setScalar(1.25);
}
scene.add(cathedral);

/* верстовой столб — смысловой якорь названия «Верстовой дом» */
const post = new THREE.Group();
{
  const w=new THREE.MeshStandardMaterial({color:0xf0f4f8, roughness:.8});
  const b=new THREE.MeshStandardMaterial({color:0x1b2430, roughness:.8});
  const col=new THREE.Mesh(new THREE.CylinderGeometry(.13,.15,2.3,10),w); col.position.y=1.15; post.add(col);
  for(let i=0;i<3;i++){const s=new THREE.Mesh(new THREE.CylinderGeometry(.152,.152,.3,10),b); s.position.y=.5+i*.66; post.add(s);}
  const sign=new THREE.Mesh(new THREE.BoxGeometry(.62,.34,.08), new THREE.MeshStandardMaterial({color:C.warm, roughness:.6, emissive:C.warm, emissiveIntensity:.25}));
  sign.position.set(.18,2.35,0); sign.rotation.y=-.4; post.add(sign);
  post.position.set(6.6,0,6.4); post.rotation.y=-.5;
  post.traverse(o=>{if(o.isMesh)o.castShadow=!MOBILE;});
}
scene.add(post); reveal(post,5.6,{dur:1.1,mode:'rise',dist:2.4,ease:E.outBack});

function frieze(len, n){
  const g=new THREE.Group();
  for(let i=0;i<n;i++){
    const x=-len/2+len*(i+.5)/n;
    let m;
    if(i%2===0){ m=new THREE.Mesh(new THREE.ConeGeometry(.085,.19,4), mCarve); m.rotation.z=Math.PI; }
    else { m=new THREE.Mesh(new THREE.BoxGeometry(.11,.11,.07), mCarve); m.rotation.z=Math.PI/4; }
    m.position.set(x,-.13,0); g.add(m);
  }
  return g;
}
function revealFrieze(g, t0, spread=.9){
  g.children.forEach((m,i)=>reveal(m, t0+i*(spread/Math.max(1,g.children.length)), {dur:.5, mode:'pop', ease:E.outBack}));
}

const SHOTS=[
  {t:0,    p:[0,3.4,27],    l:[0,3.0,0],   f:44},
  {t:3.6,  p:[10.5,2.2,14], l:[0,1.0,0],   f:40},

  {t:25.0, p:[7.8,2.6,11.5],l:[0,2.3,.5],  f:40},
  {t:30.2, p:[.5,4.8,17],   l:[0,2.4,1.5], f:44},
  {t:37.5, p:[-15,9.0,25],  l:[-1,3.6,-3], f:46},
  {t:DUR,  p:[-17,9.6,27],  l:[-1,3.6,-3], f:46}
];
const _p=new THREE.Vector3(), _l=new THREE.Vector3();
function shot(t){
  let a=SHOTS[0], b=SHOTS[SHOTS.length-1];
  for(let i=0;i<SHOTS.length-1;i++) if(t>=SHOTS[i].t && t<=SHOTS[i+1].t){a=SHOTS[i];b=SHOTS[i+1];break;}
  const k=E.inOutCubic(clamp01((t-a.t)/Math.max(.001,b.t-a.t)));
  _p.set(lerp(a.p[0],b.p[0],k),lerp(a.p[1],b.p[1],k),lerp(a.p[2],b.p[2],k));
  _l.set(lerp(a.l[0],b.l[0],k),lerp(a.l[1],b.l[1],k),lerp(a.l[2],b.l[2],k));
  return {p:_p,l:_l,f:lerp(a.f,b.f,k)};
}

/* ═══════════════════════════════════════════════════════════════
   7. ГЛАВНАЯ ФУНКЦИЯ ВРЕМЕНИ
   ═══════════════════════════════════════════════════════════════ */
const cTop=new THREE.Color(), cBot=new THREE.Color(), cWarm=new THREE.Color(0xffb877), cCold=new THREE.Color(0xbcd6ff);
function applyTime(t){
  applyTracks(t);

  /* тепло */
  const w=E.inOutCubic(clamp01((t-25.0)/3.2));
  mGlass.emissiveIntensity = w*2.6;
  lampIn.intensity  = w*26; lampOut.intensity = w*10;
  glows.forEach((s,i)=>{ s.material.opacity = w*(.42+.06*Math.sin(t*1.6+i)); });
  mCarve.emissiveIntensity = Math.max(0, 1-Math.abs(t-20.4)/1.6)*.55 + w*.06;

  /* небо / свет: холодная ночь → тёплые сумерки */
  cTop.setHex(C.night.top).lerp(new THREE.Color(C.dusk.top), w*.9);
  cBot.setHex(C.night.bot).lerp(new THREE.Color(C.dusk.bot), w*.75);
  skyU.top.value.copy(cTop); skyU.bot.value.copy(cBot);
  scene.fog.color.copy(cBot); scene.fog.density = lerp(.0135,.0092,w);
  sun.color.copy(cCold).lerp(cWarm,w); sun.intensity = lerp(2.1,1.5,w);
  hemi.intensity = lerp(.55,.75,w); hemi.groundColor.setHex(0x24384e).lerp(new THREE.Color(0x5c4433),w);

  /* дым */
  const sOn=clamp01((t-25.8)/2);
  smoke.forEach(s=>{
    const life=((t*.22+s.off)%1);
    s.s.position.set(CHIM.x+s.dx*life*3.2+Math.sin(t*.6+s.off*6)*.3, CHIM.y+life*5.2, CHIM.z+s.dz*life*2.6);
    s.s.scale.setScalar(.5+life*3.0);
    s.s.material.opacity = sOn*.30*Math.sin(Math.PI*life);
  });

  /* снег */
  const pos=snowGeoP.attributes.position;
  for(let i=0;i<SN;i++){
    const s=snowStart[i];
    let y=(s.y - t*s.sp*1.5)%28; if(y<0) y+=28;
    pos.setXYZ(i, s.x+Math.sin(t*.45+s.ph)*s.am, y, s.z+Math.cos(t*.33+s.ph)*s.am*.7);
  }
  pos.needsUpdate=true;
  snowFall.material.opacity = .35+.45*clamp01(t/2);

  /* люди толоки */
  for(const p of people){
    const e=clamp01((t-p.t0)/p.dur);
    p.g.visible = e>0;
    if(!p.g.visible) continue;
    const k=E.inOutCubic(e);
    p.g.position.lerpVectors(p.from,p.to,k);
    const walking = e<1;
    p.g.position.y = walking ? Math.abs(Math.sin(t*9+p.ph))*.07 : Math.sin(t*1.6+p.ph)*.02;
    const dir = walking ? Math.atan2(p.to.x-p.from.x, p.to.z-p.from.z) : Math.atan2(-p.to.x, 1.2-p.to.z);
    p.g.rotation.y = dir + (walking?0:Math.sin(t*.8+p.ph)*.12);
    p.g.scale.setScalar(lerp(.9,1,E.outBack(clamp01(e*3))));
  }
  /* связи */
  for(const a of arcs){
    const e=E.outCubic(clamp01((t-a.t0)/1.5));
    a.line.geometry.setDrawRange(0, Math.floor(a.n*e));
    a.line.material.opacity = e*.45*(.7+.3*Math.sin(t*2+a.t0));
  }
  /* тепловая волна */
  for(const wv of waves){
    const e=clamp01((t-wv.t0)/2.6);
    wv.m.visible = e>0 && e<1;
    wv.m.scale.setScalar(lerp(1.2,15,E.outCubic(e)));
    wv.m.material.opacity = (1-e)*.5;
  }
  /* собор на финале */
  const cf=E.outCubic(clamp01((t-37.2)/2.6));
  cathedral.children.forEach(c=>c.material.opacity=cf*.92);

  /* камера */
  const s=shot(t);
  camera.fov = s.f; camera.updateProjectionMatrix();
  if(look.on){
    const off=new THREE.Vector3().subVectors(s.p,s.l);
    const sph=new THREE.Spherical().setFromVector3(off);
    sph.theta += look.az; sph.phi = THREE.MathUtils.clamp(sph.phi+look.pol,.18,1.48);
    sph.radius *= look.dist;
    camera.position.copy(s.l).add(new THREE.Vector3().setFromSpherical(sph));
    camera.lookAt(s.l);
  }else{
    camera.position.set(s.p.x + Math.sin(t*.35)*.28 + mouse.x*.9,
                        s.p.y + Math.cos(t*.27)*.18 - mouse.y*.5,
                        s.p.z + Math.sin(t*.21)*.22);
    camera.lookAt(s.l);
  }
  updateUI(t);
}

/* ═══════════════════════════════════════════════════════════════
   8. UI / УПРАВЛЕНИЕ
   ═══════════════════════════════════════════════════════════════ */
const el = id=>document.getElementById(id);
const cap=el('caption'), capK=cap.querySelector('.k'), capH=cap.querySelector('h3'), capP=cap.querySelector('p');
const prolog=el('prolog'), endcard=el('endcard'), fill=el('bar').querySelector('.fill'), dots=el('bar').querySelector('.dots');
CH.forEach((c,i)=>{const d=document.createElement('div'); d.className='dot'; d.style.left=(c.t/DUR*100)+'%';
  d.title=c.h; d.onclick=e=>{e.stopPropagation(); setTime(c.t+.02);}; dots.appendChild(d);});
let lastCh=-1;
function updateUI(t){
  let idx=0; for(let i=0;i<CH.length;i++) if(t>=CH[i].t) idx=i;
  if(idx!==lastCh){
    lastCh=idx; cap.classList.remove('in');
    setTimeout(()=>{capK.textContent=CH[idx].k; capH.textContent=CH[idx].h; capP.textContent=CH[idx].p;
      if(idx>0 && t<38.6) cap.classList.add('in');},180);
    [...dots.children].forEach((d,i)=>d.classList.toggle('on',i===idx));
  }
  cap.classList.toggle('in', idx>0 && t<38.4);
  prolog.classList.toggle('hide', t>3.0);
  endcard.classList.toggle('show', t>39.4);
  fill.style.width=(t/DUR*100)+'%';
}
let time = parseFloat(Q.get('t')||'0')||0, playing=!REDUCED, prev=performance.now();
if(REDUCED){ time=39.6; }
function setTime(v){ time=THREE.MathUtils.clamp(v,0,DUR); lastCh=-1; applyTime(time); }
function setPlay(v){ playing=v; el('bPlay').textContent = v?'⏸ Пауза':'▶ Пуск'; el('bPlay').classList.toggle('on',!v); }
el('bPlay').onclick=()=>{ if(look.on) toggleLook(false); setPlay(!playing); };
el('bReplay').onclick=()=>{ toggleLook(false); setTime(0); setPlay(true); };
el('bLook').onclick=()=>toggleLook(!look.on);
el('bar').addEventListener('pointerdown',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  toggleLook(false); setTime((e.clientX-r.left)/r.width*DUR);
});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault(); if(look.on)toggleLook(false); setPlay(!playing);}
  if(e.key==='r'||e.key==='R'){toggleLook(false);setTime(0);setPlay(true);}
  if(e.key==='f'||e.key==='F')toggleLook(!look.on);
  if(e.key==='ArrowRight')setTime(time+2);
  if(e.key==='ArrowLeft')setTime(time-2);
});
/* осмотр */
const look={on:false,az:0,pol:0,dist:1,drag:false,px:0,py:0};
const mouse={x:0,y:0};
function toggleLook(v){
  look.on=v; el('bLook').classList.toggle('on',v);
  if(v){ setPlay(false); look.az=0; look.pol=0; look.dist=1; }
  else setPlay(true);
}
canvas.addEventListener('pointerdown',e=>{ if(!look.on)toggleLook(true); look.drag=true; look.px=e.clientX; look.py=e.clientY; canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>look.drag=false);
canvas.addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth-.5); mouse.y=(e.clientY/innerHeight-.5);
  if(!look.drag||!look.on)return;
  look.az -= (e.clientX-look.px)*.006; look.pol -= (e.clientY-look.py)*.004;
  look.pol=THREE.MathUtils.clamp(look.pol,-.7,.7);
  look.px=e.clientX; look.py=e.clientY;
});
canvas.addEventListener('wheel',e=>{ if(!look.on)return; e.preventDefault();
  look.dist=THREE.MathUtils.clamp(look.dist*Math.exp(e.deltaY*.0011),.4,2.6);},{passive:false});
addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });

/* цикл */
function tick(now){
  const dt=Math.min(.05,(now-prev)/1000); prev=now;
  if(playing && !look.on){
    time+=dt;
    if(time>=DUR){ if(LOOP) time=0; else {time=DUR; setPlay(false);} }
  }
  applyTime(time);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
if(Q.get('look')==='1') toggleLook(true);
setPlay(playing); applyTime(time);
requestAnimationFrame(tick);
setTimeout(()=>el('load').classList.add('gone'),350);
</script>
