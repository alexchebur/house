<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Верстовой дом · Путь к энергии</title>
<style>
  :root{--warm:#ff6a2b;--deep:#0b1c2e;--snow:#eef4fa;--ink:rgba(238,244,250,.72);--panel:rgba(11,28,46,.42);--line:rgba(238,244,250,.16);--serif:"Georgia",serif;--sans:system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--deep);color:var(--snow);font-family:var(--sans);overflow:hidden}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:2}
  .vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(4,12,22,.6) 100%)}
  
  /* UI Элементы */
  #brand{position:absolute;top:20px;right:20px;display:flex;align-items:center;gap:10px;opacity:0;animation:fadeIn 1s .5s forwards}
  #brand .mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(140deg,var(--warm),#ff9a45);display:grid;place-items:center;font-weight:800;color:#1b0d04}
  #brand .txt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink)}
  
  #endcard{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 24px;opacity:0;transition:opacity 1.5s ease}
  #endcard.show{opacity:1}
  #endcard h2{font-family:var(--serif);font-size:clamp(32px,8vw,72px);margin-bottom:12px;letter-spacing:.05em}
  #endcard p{font-size:clamp(12px,3vw,16px);color:var(--ink);letter-spacing:.15em;text-transform:uppercase}
  
  #controls{position:absolute;bottom:20px;left:20px;right:20px;display:flex;gap:10px;pointer-events:auto}
  button{font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--snow);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(8px)}
  button:hover{border-color:var(--warm)}
  
  @keyframes fadeIn{to{opacity:1}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vig"></div>
<div id="ui">
  <div id="brand"><div class="mark">Т+</div><div class="txt">ПАО «Т Плюс»</div></div>
  <div id="endcard">
    <h2>Верхотурская ГЭС</h2>
    <p>Энергия, сохраняющая историю</p>
  </div>
  <div id="controls">
    <button id="bReplay">↻ Повторить путь</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════
   КОНФИГУРАЦИЯ СЦЕНЫ
   ═══════════════════════════════════════════════════════════════ */
const C = { warm:0xff6a2b, deep:0x0b1c2e, snow:0xe6eef7, water:0x1a3b5c, concrete:0x8a9bb0 };
const DUR = 20; // Длительность финальной сцены
let time = 0, playing = true;

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('scene'), antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(C.deep, 0.008);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 1000);

/* Свет */
scene.add(new THREE.HemisphereLight(0xffffff, 0x080820, 0.6));
const sun = new THREE.DirectionalLight(0xffaa77, 1.5);
sun.position.set(-50, 100, 50);
scene.add(sun);

/* ═══════════════════════════════════════════════════════════════
   ЛАНДШАФТ И РЕКА ТУРА
   ═══════════════════════════════════════════════════════════════ */
// Создаем ландшафт с руслом реки
const groundGeo = new THREE.PlaneGeometry(400, 400, 128, 128);
const pos = groundGeo.attributes.position;
for(let i=0; i<pos.count; i++){
  const x = pos.getX(i), y = pos.getY(i);
  let z = Math.sin(x*0.02)*Math.cos(y*0.02)*5 + Math.random()*0.5;
  // Русло реки по центру (ось X)
  const distToRiver = Math.abs(y);
  if(distToRiver < 15) z -= (15 - distToRiver) * 0.8; // Углубление
  if(distToRiver < 8) z -= (8 - distToRiver) * 1.5;   // Глубокое русло
  pos.setZ(i, z);
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({color:C.snow, roughness:0.9}));
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Вода
const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 30), new THREE.MeshStandardMaterial({
  color:C.water, transparent:true, opacity:0.85, roughness:0.1, metalness:0.8
}));
water.rotation.x = -Math.PI/2;
water.position.y = -2.5;
scene.add(water);

/* ═══════════════════════════════════════════════════════════════
   МОДЕЛЬ ВЕРХОТУРСКОЙ ГЭС (Low-Poly)
   ═══════════════════════════════════════════════════════════════ */
const gesGroup = new THREE.Group();
gesGroup.position.set(0, -2.5, -60); // Стоит на реке вдали
scene.add(gesGroup);

// Плотина
const dam = new THREE.Mesh(new THREE.BoxGeometry(40, 8, 6), new THREE.MeshStandardMaterial({color:C.concrete}));
dam.position.y = 4;
gesGroup.add(dam);

// Машинный зал (с оранжевыми акцентами Т+)
const hall = new THREE.Mesh(new THREE.BoxGeometry(20, 6, 10), new THREE.MeshStandardMaterial({color:0x556677}));
hall.position.set(0, 3, 6);
gesGroup.add(hall);

// Труба/водосброс
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 12, 8), new THREE.MeshStandardMaterial({color:0x334455}));
pipe.rotation.z = Math.PI/2;
pipe.position.set(0, 2, -4);
gesGroup.add(pipe);

// Оранжевые элементы бренда на ГЭС
const brandBox = new THREE.Mesh(new THREE.BoxGeometry(18, 0.5, 0.5), new THREE.MeshBasicMaterial({color:C.warm}));
brandBox.position.set(0, 6, 6.1);
gesGroup.add(brandBox);

/* ═══════════════════════════════════════════════════════════════
   СВЕТЯЩАЯСЯ ДОРОЖКА (ПУТЬ)
   ═══════════════════════════════════════════════════════════════ */
// Кривая пути от дома (примерно 0,0,0) к ГЭС (0,0,-60)
const pathPoints = [
  new THREE.Vector3(0, 0.5, 10),   // Старт у дома
  new THREE.Vector3(5, 0.2, -10),  // Изгиб через лес
  new THREE.Vector3(-5, 0.2, -30), // Изгиб к реке
  new THREE.Vector3(0, 0.5, -55)   // Финиш у ГЭС
];
const curve = new THREE.CatmullRomCurve3(pathPoints);
const tubeGeo = new THREE.TubeGeometry(curve, 100, 0.15, 8, false);
const pathMat = new THREE.MeshBasicMaterial({color:C.warm, transparent:true, opacity:0, blending:THREE.AdditiveBlending});
const pathMesh = new THREE.Mesh(tubeGeo, pathMat);
scene.add(pathMesh);

// Частицы вдоль пути
const partCount = 200;
const partGeo = new THREE.BufferGeometry();
const partPos = new Float32Array(partCount*3);
const partData = []; // {t, speed}
for(let i=0; i<partCount; i++){
  partData.push({t: Math.random(), speed: 0.005 + Math.random()*0.01});
  const pt = curve.getPointAt(partData[i].t);
  partPos[i*3]=pt.x; partPos[i*3+1]=pt.y+0.5; partPos[i*3+2]=pt.z;
}
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
const particles = new THREE.Points(partGeo, new THREE.PointsMaterial({
  color:C.warm, size:0.4, transparent:true, opacity:0, blending:THREE.AdditiveBlending
}));
scene.add(particles);

/* ═══════════════════════════════════════════════════════════════
   КАМЕРА И АНИМАЦИЯ (Исправлено: поток от ГЭС к Дому)
   ═══════════════════════════════════════════════════════════════ */
function animatePath(t){
  // 1. Появление пути (0-5 сек)
  const pathProgress = Math.min(1, t/5);
  pathMat.opacity = pathProgress * 0.8;
  particles.material.opacity = pathProgress * 0.6;
  
  // Обновление частиц (ДВИЖЕНИЕ ОТ ГЭС К ДОМУ)
  const positions = particles.geometry.attributes.position.array;
  for(let i=0; i<partCount; i++){
    if(pathProgress < 0.1) continue;
    
    // ИНВЕРСИЯ: уменьшаем t, чтобы частицы летели от конца (ГЭС) к началу (Дом)
    partData[i].t -= partData[i].speed;
    if(partData[i].t < 0) partData[i].t = 1;
    
    // Показываем частицы только если путь до них "дорос" (теперь считаем от конца)
    // Но для визуального эффекта "заполнения" оставим логику появления от дома
    if(partData[i].t > (1 - pathProgress)){ 
       // Если частица еще не должна быть видна (путь до нее не дошел)
       positions[i*3+1] = -10; 
    } else {
      const pt = curve.getPointAt(partData[i].t);
      // Добавляем легкое дрожание для эффекта живой энергии
      positions[i*3] = pt.x + Math.sin(t*5+i)*0.2; 
      positions[i*3+1] = pt.y + 0.5 + Math.cos(t*3+i)*0.2;
      positions[i*3+2] = pt.z;
    }
  }
  particles.geometry.attributes.position.needsUpdate = true;

  // 2. Импульс энергии в доме (когда путь дошел до конца)
  if(t > 4.5 && t < 6) {
    const flash = 1 - (t-4.5)/1.5;
    brandBox.material.color.setHex(0xffffff); // Вспышка на ГЭС при старте
    brandBox.material.color.lerp(new THREE.Color(C.warm), flash);
  } else {
    brandBox.material.color.setHex(C.warm);
  }

  // 3. Движение камеры
  if(t < 6) {
    // Статичный вид на дом (условно)
    camera.position.set(10, 5, 15);
    camera.lookAt(0, 2, 0);
  } else if (t < 14) {
    // Полет вдоль пути ОТ ГЭС К ДОМУ
    // Инвертируем flightT, чтобы камера летела от точки 1 к точке 0
    const flightT = 1 - ((t-6)/8); 
    const camPos = curve.getPointAt(flightT);
    
    // Камера смотрит вперед по направлению движения (к дому)
    camera.position.set(camPos.x + 8, camPos.y + 4, camPos.z + 8);
    camera.lookAt(curve.getPointAt(Math.max(0, flightT-0.1)));
  } else {
    // Финальный вид на Дом (он теперь в фокусе как получатель энергии)
    const finalT = Math.min(1, (t-14)/2);
    // Камера подлетает ближе к дому
    camera.position.lerp(new THREE.Vector3(10, 5, 15), finalT*0.1);
    camera.lookAt(0, 2, 0);
    document.getElementById('endcard').classList.toggle('show', t > 16);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ЦИКЛ РЕНДЕРА
   ═══════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if(playing) {
    time += dt;
    if(time > DUR+2) time = 0; // Цикл
  }
  animatePath(time);
  renderer.render(scene, camera);
}

document.getElementById('bReplay').onclick = () => {
  time = 0;
  document.getElementById('endcard').classList.remove('show');
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

loop();
</script>
</body>
</html>
